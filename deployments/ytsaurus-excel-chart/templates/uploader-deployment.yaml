apiVersion: apps/v1
kind: Deployment
metadata:
  name: "ytsaurus-excel-uploader"
  labels:
    {{- include "ytsaurus-excel-chart.uploaderLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if and .Values.settings.uploader.eventLog.enabled .Values.settings.uploader.eventLog.persistence.enabled }}
  # A single ReadWriteOnce event-log PVC can't be shared by an old and a new
  # pod during a rolling update (PVC attach conflict across nodes, and a
  # timbertruck pid-file lock conflict on the same node), so recreate instead.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "ytsaurus-excel-chart.uploaderSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ytsaurus-excel-chart.uploaderLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          command:
            - "/usr/bin/excel-uploader"
            - "-config"
            - "/etc/config.yaml"
            - "-log-to-stderr"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.uploader.repository }}:{{ .Values.image.uploader.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.uploader.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.settings.uploader.http_port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.settings.uploader.debug_http_port }}
              protocol: TCP
          livenessProbe:
            httpGet:
            {{- $apiPrefix := .Values.settings.uploader.api_path_prefix | default "" | trimAll "/" }}
            {{- with (first (.Values.settings.uploader.clusters | default .Values.settings.clusters)) }}
              path: {{ if $apiPrefix }}/{{ $apiPrefix }}{{ end }}/{{- .api_endpoint_name -}}/api/ready
            {{- end }}
              port: {{ .Values.settings.uploader.http_port }}

          readinessProbe:
            httpGet:
            {{- $apiPrefix := .Values.settings.uploader.api_path_prefix | default "" | trimAll "/" }}
            {{- with (first (.Values.settings.uploader.clusters | default .Values.settings.clusters)) }}
              path: {{ if $apiPrefix }}/{{ $apiPrefix }}{{ end }}/{{- .api_endpoint_name -}}/api/ready
            {{- end }}
              port: {{ .Values.settings.uploader.http_port }}
          volumeMounts:
            - mountPath: /etc/config.yaml
              name: config
              readOnly: true
              subPath: uploader-config.yaml
            {{- if .Values.settings.uploader.eventLog.enabled }}
            - mountPath: {{ .Values.settings.uploader.eventLog.logDir }}
              name: event-log
            {{- end }}
        {{- if and .Values.settings.uploader.eventLog.enabled .Values.settings.uploader.eventLog.timbertruck.enabled }}
        - name: timbertruck
          image: {{ .Values.settings.uploader.eventLog.timbertruck.image | required "settings.uploader.eventLog.timbertruck.image is required when timbertruck is enabled" | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - "/usr/bin/timbertruck_os"
            - "-config"
            - "/etc/timbertruck/config.yaml"
          env:
            - name: {{ .Values.settings.uploader.eventLog.timbertruck.tokenSecretKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.settings.uploader.eventLog.timbertruck.tokenSecretName | required "settings.uploader.eventLog.timbertruck.tokenSecretName is required when timbertruck is enabled" | quote }}
                  key: {{ .Values.settings.uploader.eventLog.timbertruck.tokenSecretKey }}
            - name: YT_PROXY
              value: {{ .Values.settings.uploader.eventLog.timbertruck.ytProxy | quote }}
          volumeMounts:
            - mountPath: {{ .Values.settings.uploader.eventLog.logDir }}
              name: event-log
            - mountPath: /etc/timbertruck
              name: timbertruck-config
              readOnly: true
        {{- end }}
      volumes:
        - configMap:
            defaultMode: 420
            name: "ytsaurus-excel-cm"
          name: config
        {{- if .Values.settings.uploader.eventLog.enabled }}
        - name: event-log
          {{- if .Values.settings.uploader.eventLog.persistence.enabled }}
          persistentVolumeClaim:
            claimName: ytsaurus-excel-uploader-event-log
          {{- else if .Values.settings.uploader.eventLog.volume }}
          {{- toYaml .Values.settings.uploader.eventLog.volume | nindent 10 }}
          {{- else }}
          {{- fail "settings.uploader.eventLog: either persistence.enabled or volume must be set when eventLog.enabled is true" }}
          {{- end }}
        {{- end }}
        {{- if and .Values.settings.uploader.eventLog.enabled .Values.settings.uploader.eventLog.timbertruck.enabled }}
        - name: timbertruck-config
          configMap:
            defaultMode: 420
            name: ytsaurus-excel-uploader-timbertruck-config
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
